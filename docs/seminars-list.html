async function loadSeminars() {
  const response = await fetch("seminars.json");
  const seminars = await response.json();

  // 1. データを2つに振り分ける
  const activeSeminars = seminars.filter(item => item.status !== "終了");
  const pastSeminars = seminars.filter(item => item.status === "終了");

  // 2. それぞれの場所（ID）にHTMLを生成して入れる
  renderGrid(activeSeminars, 'active-seminar-list');
  renderGrid(pastSeminars, 'past-seminar-list');
}

// HTML生成用の共通関数（何度も書かなくて済むように分離！）
function renderGrid(dataList, targetId) {
  const $list = document.getElementById(targetId);
  if (!$list) return; // エレメントが無ければ何もしない

  const html = dataList.map(item => {
    // タグの生成
    const tagsHtml = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
    // ステータスによってバッジの色を変えるクラス名
    let badgeClass = '';
    if (item.status === '募集中') badgeClass = 'recruit';
    if (item.status === '終了') badgeClass = 'finished';

    return `
      <article class="seminar-card">
        <div class="card-image">
          <img src="${item.image}" alt="${item.title}">
          <span class="status-badge ${badgeClass}">${item.status}</span>
        </div>
        <div class="card-content">
          <div class="card-tags">${tagsHtml}</div>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-info"><i class="fa-regular fa-clock"></i> ${item.day}</p>
          <p class="card-info"><i class="fa-solid fa-location-dot"></i> ${item.place}</p>
          <p class="card-desc">${item.description}</p>
        </div>
      </article>
    `;
  }).join('');

  $list.innerHTML = html;
}
