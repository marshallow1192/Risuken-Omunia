<!DOCTYPE html>
<html lang="ja">
<head>
    <title>記事編集ページ</title>
    <link rel="icon" href="img/favicon.png" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../docs/style.css">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <meta name="google-site-verification" content="FopI5soj9MaN8IgVC_4FoFFB4G7aFBI3CIDFDqXmuvY" />
    <style>
        /* 編集ページ専用のスタイル */
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .editor-container { gap: 20px; padding: 20px; }
        .form-area, .preview-area { flex: 1; padding: 20px; }
        .preview-area { border: 1px solid #ccc; border-radius: 8px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 5px; }
        textarea { height: 300px; }
        #preview-image { max-width: 100%; margin: 20px 0; }
        .edit { display: inline; }
        .admin-button { padding: 4px 8px; border: 1px solid #ccc; background-color: #f8f8f8; border-radius: 4px; text-decoration: none; color: #333; cursor: pointer; font-size: 14px; }
        .admin-button:hover { background-color: #eee; }
        #preview-content img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 10px 0; }
    </style>
</head>
<body>
<div class="editor-container">
    <h1>記事編集フォーム</h1>
    <button id="generate-btn" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
        <i class="fa-solid fa-rotate"></i> サイトを更新して公開する
    </button>
    <form id="edit-form">
        <label>タイトル:40文字以内</label>
        <input type="text" id="title" name="title" maxlength="40" required>

        <label>日付 (YYYY-MM-DD):</label>
        <input type="date" id="date" name="date" required>

        <label>現在の画像:</label>
        <img id="current-image" src="" alt="現在の画像" class="current-image" style="max-width: 200px; display: none;">
        <label>画像を更新:</label>
        <input type="file" id="image" name="image" accept="image/*">

        <label>本文 (Markdown形式):</label>

        <div class="editor-toolbar" style="margin-bottom: 5px;">
            <label style="cursor: pointer; background: #17a2b8; color: white; padding: 5px 10px; font-size: 14px; border-radius: 4px; display: inline-block;">
                <i class="fa-solid fa-image"></i> 本文に画像を挿入
                <input type="file" id="body-image-upload" style="display: none;" accept="image/*">
            </label>
        </div>

        <textarea id="contentMd" name="contentMd"></textarea>

        <button type="submit">更新する</button>
    </form>
    <a href="admin.html">管理ページに戻る</a>
    
    <div class="preview-area">
        <h2>プレビュー</h2>
        <article class="report-content">
            <h2><span class="section-sub-title">Information</span></h2>
            <h1><span id="preview-title">タイトルがここに表示されます</span></h1>
            <time id="preview-date">2025年9月28日</time>
            <img id="preview-image" src="" alt="プレビュー画像" style="display:none;">
            <div id="preview-content" class="report-body">
                <p>本文のプレビューがここに表示されます。</p>
            </div>
        </article>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    $(async function() {
        const API_URL = 'http://localhost:3000/api/posts';

        // 1. URLから編集したい記事のIDを取得
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');

        if (!postId) {
            alert('編集する記事のIDが指定されていません。');
            window.location.href = 'admin.html';
            return;
        }

        // --- プレビュー更新機能 ---
        function updatePreview() {
            const title = $('#title').val();
            const date = $('#date').val();
            const contentMd = $('#contentMd').val();
            const imageInput = $('#image')[0];

            let displayDate = '日付';
            if (date) {
                const d = new Date(date);
                displayDate = `公開日 : ${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
            }

            $('#preview-title').text(title || 'タイトルがここに表示されます');
            $('#preview-date').text(displayDate);
            $('#preview-content').html(marked.parse(contentMd || ''));

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = e => $('#preview-image').attr('src', e.target.result).show();
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                // 新しい画像が選択されていなければ、既存の画像（ロード時にセットされたもの）があればそれを維持
                // 何もしなくてOK（src属性が残っているため）
            }
        }

        // --- 既存データの取得とフォームへのセット ---
        try {
            const response = await fetch(`${API_URL}/${postId}`);
            if (!response.ok) throw new Error('記事データの取得に失敗しました。');

            const postData = await response.json();

            $('#title').val(postData.title);
            $('#date').val(postData.date);

            // ★修正ポイント1：本文中のパスを修正してセット
            // "docs/img/" が含まれていたら "img/" に置換して、プレビューで表示できるようにする
            const fixedContent = postData.contentMd ? postData.contentMd.replace("![画像の説明](../img/", '![画像の説明](docs/img/') : '';
            $('#contentMd').val(fixedContent);

            // 既存のサムネイル画像があれば表示
            const currentImgPath = postData.img || postData.image;
            if (currentImgPath) {
                // パスの調整（docs/始まりだったら削るなど）
                // ここでは単純にサーバーのルートからのパスとして扱います
                let displayImgPath = currentImgPath;
                if (displayImgPath.startsWith('docs/')) {
                    displayImgPath = displayImgPath.replace('docs/', '');
                }

                const fullPath = `http://localhost:3000/${displayImgPath}`;
                $('#current-image').attr('src', fullPath).show();
                $('#preview-image').attr('src', fullPath).show();
            }

            updatePreview();

        } catch (error) {
            alert(error.message);
            console.error(error);
        }

        // --- イベントリスナー ---
        $('#edit-form input, #edit-form textarea').on('input', updatePreview);

        // ★修正ポイント2：本文への画像挿入機能（admin.htmlと統一）
        $('#body-image-upload').on('change', async function() {
            const file = this.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('http://localhost:3000/api/upload-image', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('アップロード失敗');

                const result = await response.json();
                const imageUrl = result.url;

                // カーソル位置にMarkdownを挿入
                const $textarea = $('#contentMd');
                const textarea = $textarea[0];
                const cursorPos = textarea.selectionStart;
                const textBefore = textarea.value.substring(0, cursorPos);
                const textAfter = textarea.value.substring(cursorPos);

                const insertText = `\n![画像の説明](${imageUrl})\n`;

                textarea.value = textBefore + insertText + textAfter;

                // プレビューを更新
                updatePreview();

            } catch (error) {
                console.error(error);
                alert('画像のアップロードに失敗しました');
            }
            // 同じファイルを連続で選べるようにリセット
            $(this).val('');
        });

        // サイト生成（更新）ボタンの処理
        $('#generate-btn').on('click', async function() {
            if (!confirm('記事ページを再生成して、サイトを更新しますか？')) return;

            const $btn = $(this);
            const originalText = $btn.html();
            $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 更新中...');

            try {
                const response = await fetch('http://localhost:3000/api/generate', { method: 'POST' });
                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                } else {
                    alert('エラー: ' + result.message);
                }
            } catch (error) {
                console.error(error);
                alert('通信エラーが発生しました。');
            } finally {
                $btn.prop('disabled', false).html(originalText);
            }
        });

        // フォーム送信（更新）の処理
        $('#edit-form').on('submit', async function(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            // 日付の表示用フォーマットを作成
            const dateVal = formData.get('date');
            const dateObj = new Date(dateVal);
            const displayDate = `${dateObj.getFullYear()}年${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
            formData.append('displayDate', displayDate);

            try {
                const response = await fetch(`${API_URL}/${postId}`, {
                    method: 'PUT',
                    body: formData,
                });
                const result = await response.json();
                alert(result.message);
                if (response.ok) {
                    window.location.href = 'admin.html'; // 成功したら一覧に戻る
                }
            } catch (error) {
                console.error('更新エラー:', error);
                alert('記事の更新に失敗しました。');
            }
        });
    });
</script>
</body>
</html>
